# A release from a tag: the same publish.cmd a developer runs, on a Windows runner, its zip
# attached to a draft release for the tag. Push `v0.1.0` and a draft appears under Releases
# to read over and publish. Nothing of the games is needed to build.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: cmd
        run: publish.cmd
      - name: The tagged version's notes
        # Only this version's "## <version> - ..." section of Docs/Releases.md, without the file's
        # preamble or other versions; a section the file lacks leaves the description empty.
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content Docs/Releases.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($version))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { "" | Set-Content dist/notes.md; exit 0 }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern "^## " | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body -join "`n" | Set-Content dist/notes.md
      - name: Draft the release with the zip
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/OpenFF-*-win-x64.zip
          body_path: dist/notes.md

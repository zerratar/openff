<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crystal</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1 title="Crystal - the OpenFF editor"><span class="gem"></span>Crystal</h1>
  <!-- Built by project.js from whatever is open. -->
  <nav id="menubar"></nav>
  <span id="project-name" title="File &#9656; New project&#8230;">no project</span>
  <!-- The mod's GameService, one click away: opens it, or writes the stub. project.js fills it. -->
  <button id="service-button" hidden></button>
  <!-- What is open. Its own element, because #status belongs to say(): the two used
       to share one and whichever spoke last won, so a save confirmation and the
       workspace summary kept wiping each other out. -->
  <span id="summary"></span>
  <span id="status"></span>
  <!--
    Whether the edits are in the game yet. Only a loose install can be installed
    into - ours reads the project directly - so this stays hidden for our own build.
    The two buttons that were here are on the Project menu now.
  -->
  <span id="mod" hidden><span id="mod-state"></span></span>
</header>

<!--
  The workbench. Four panels round a document area, the way a scene editor is laid
  out: what is in the thing on the left, what you have open in the middle, the details
  of whatever is selected on the right, and everything you could open along the bottom.
  The three bars between them drag.
-->
<div id="workbench">
  <div id="upper">

    <aside id="hierarchy-panel" class="panel">
      <div class="panel-head">
        <span>Hierarchy</span>
        <span class="panel-note" id="hierarchy-note"></span>
      </div>
      <input id="hierarchy-filter" type="search" placeholder="filter" autocomplete="off">
      <ul id="hierarchy" class="tree"></ul>
    </aside>

    <div class="splitter vertical" data-split="left" role="separator" aria-orientation="vertical" aria-label="resize the hierarchy"></div>

    <section id="centre">
      <div id="doc-area"></div>
      <!-- The start page. project.js fills it; it hides itself when a document is open. -->
      <div id="no-docs" class="start"></div>
      <div id="split-hint">drop here to split</div>
    </section>

    <div class="splitter vertical" data-split="right" role="separator" aria-orientation="vertical" aria-label="resize the inspector"></div>

    <aside id="inspector-panel" class="panel">
      <div class="panel-head"><span>Inspector</span></div>
      <div id="inspector"></div>
    </aside>

  </div>

  <div class="splitter horizontal" data-split="bottom" role="separator" aria-orientation="horizontal" aria-label="resize the project panel"></div>

  <div id="lower">
    <div id="bottom-tabs">
      <button data-bottom="project" class="on">Project</button>
      <button data-bottom="console">Console <span id="console-count"></span></button>
    </div>
    <div id="bottom-body">
      <div class="bottom-page on" id="project" data-page="project">
        <div id="project-tree" class="tree"></div>
        <div class="splitter vertical" data-split="tree" role="separator" aria-orientation="vertical" aria-label="resize the project tree"></div>
        <div id="project-side">
          <div id="project-bar">
            <input id="filter" type="search" placeholder="filter" autocomplete="off">
            <!-- What the OpenFF mod folder offers: a new file, a build, the IDE. shell.js fills it. -->
            <span id="code-actions" hidden></span>
            <span class="views">
              <button id="view-list" class="on" title="list">
                <svg viewBox="0 0 16 16" class="icon"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
              </button>
              <button id="view-grid" title="icons">
                <svg viewBox="0 0 16 16" class="icon"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
              </button>
            </span>
          </div>
          <ul id="files" tabindex="0"></ul>
        </div>
      </div>
      <div class="bottom-page" data-page="console">
        <div id="console-lines"></div>
      </div>
    </div>
  </div>

  <!--
    The last thing the editor said, always visible. Clicking it opens the console at
    that line, so the answer to "did the compile work" does not need a trip to another
    tab to find out.
  -->
  <button id="statusbar" type="button">
    <span id="statusbar-dot"></span>
    <span id="statusbar-text">ready</span>
    <span id="statusbar-hint">console</span>
  </button>
</div>

<!-- Scripts -->
<template id="view-script">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <span class="grow"></span>
      <button class="check">Check</button>
      <button class="save primary">Compile &amp; save</button>
      <button class="revert">Revert</button>
    </div>
    <div class="editor">
      <div class="gutter"></div>
      <div class="code">
        <pre class="highlight" aria-hidden="true"></pre>
        <textarea spellcheck="false" wrap="off"></textarea>
        <ul class="completions" hidden></ul>
      </div>
    </div>
    <div class="signature"></div>
    <ul class="problems"></ul>
  </div>
</template>

<!-- The mod's own files: C#, scene files, project.json -->
<template id="view-code">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge readonly">read only</span>
      <span class="badge dirty">unsaved</span>
      <span class="grow"></span>
      <button class="ide" title="Open this file with whatever opens it on this machine - Visual Studio, Rider, VS Code">Open in IDE</button>
      <button class="build" title="Save, then dotnet build of the mod's code; errors land below">Build</button>
      <button class="save primary" title="Ctrl+S">Save</button>
    </div>
    <div class="editor">
      <div class="gutter"></div>
      <div class="code">
        <pre class="highlight" aria-hidden="true"></pre>
        <textarea spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
    <ul class="problems"></ul>
  </div>
</template>

<!-- A CastScript's code: the script editor with its completion and signatures, saving into the scene -->
<template id="view-castcode">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="note cast-where"></span>
      <span class="badge saving">saving…</span>
      <span class="badge problem"></span>
      <span class="grow"></span>
      <button class="commands" title="Every command of the script language with what it takes; picks one into the code">Commands…</button>
      <button class="check" title="Compile the lines as the client will">Check</button>
    </div>
    <div class="editor">
      <div class="gutter"></div>
      <div class="code">
        <pre class="highlight" aria-hidden="true"></pre>
        <textarea spellcheck="false" wrap="off"></textarea>
        <ul class="completions" hidden></ul>
      </div>
    </div>
    <div class="signature"></div>
    <ul class="problems"></ul>
  </div>
</template>

<!-- The mod's text: a table of id -> line, the JSON underneath -->
<template id="view-strings">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge saving">saving…</span>
      <span class="badge problem"></span>
      <span class="grow"></span>
      <button class="add primary" title="A new line at the next free id">Add line</button>
      <button class="as-code" title="The file as text in the code editor">Open as JSON</button>
    </div>
    <div class="menu-body strings-body">
      <div class="strings-wrap">
        <p class="hint">Each line has an id the mod says it by: <code>"@id"</code> in a Chest or Talk field, <code>startMessage2(0, id, 0, 0)</code> in a CastScript, <code>Game.Say("@id")</code> in C#. Enter breaks the line in the window; <code>%shuyaku1%</code> is the first hero's name.</p>
        <table class="strings">
          <thead><tr><th class="id">Id</th><th></th><th>Line</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="xml-split">
        <div class="xml-grip" title="drag to resize"></div>
        <div class="xml-bar">
          <span class="xml-note">JSON - <strong class="xml-what">the file as saved</strong></span>
          <span class="grow"></span>
          <button class="apply primary">Apply to the table</button>
          <button class="xml-collapse" title="collapse">&#9662;</button>
        </div>
        <textarea class="xml" spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
  </div>
</template>

<!-- Menus -->
<template id="view-menu">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <select class="screens"></select>
      <select class="zoom" title="canvas zoom">
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2" selected>200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <label class="toggle"><input type="checkbox" class="preview"> Preview</label>
      <span class="grow"></span>
      <button class="adopt" hidden title="Copy this screen of the game's into the mod (menus/): the client plays the mod's copy in the game's place, with your frames, styles and behaviours">Take into the mod</button>
      <button class="duplicate">Duplicate</button>
      <button class="remove">Delete</button>
      <button class="save primary">Save</button>
      <button class="revert">Revert</button>
    </div>
    <div class="menu-body">
      <div class="canvas-wrap">
        <div class="canvas-scale"><div class="canvas"></div></div>
        <p class="hint">Drag a widget to move it. Arrow keys nudge, shift+arrow moves by 8.
          Click an empty spot to select nothing.</p>
      </div>
      <div class="xml-split">
        <div class="xml-grip" title="drag to resize"></div>
        <div class="xml-bar">
          <span class="xml-note">XML for <strong class="xml-what">the whole file</strong></span>
          <span class="grow"></span>
          <button class="apply primary">Apply to the canvas</button>
          <button class="xml-collapse" title="collapse">&#9662;</button>
        </div>
        <textarea class="xml" spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
  </div>
</template>

<!-- Text -->
<template id="view-text">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <span class="grow"></span>
      <button class="save primary">Save</button>
      <button class="revert">Revert</button>
    </div>
    <div class="messages"></div>
  </div>
</template>

<!-- Tables -->
<template id="view-table">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <select class="chains"></select>
      <input class="rowfilter" type="search" placeholder="filter rows" autocomplete="off">
      <label class="pads"><input type="checkbox"> padding</label>
      <span class="grow"></span>
      <button class="save primary">Save</button>
      <button class="revert">Revert</button>
    </div>
    <p class="note"></p>
    <div class="grid-wrap"><table class="grid"></table></div>
  </div>
</template>

<!-- Game data: the unified tables, read only -->
<template id="view-data">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <input class="rowfilter" type="search" placeholder="filter rows" autocomplete="off">
      <span class="count muted"></span>
      <span class="grow"></span>
    </div>
    <p class="note"></p>
    <div class="grid-wrap"><table class="grid"></table></div>
  </div>
</template>

<!-- Maps -->
<template id="view-map">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <select class="zoom" title="zoom">
        <option value="1">100%</option>
        <option value="2" selected>200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <label class="toggle"><input type="checkbox" class="showlogic"> logic-only casts</label>
      <span class="modes">
        <button class="mode" data-mode="2d">2D</button>
        <button class="mode on" data-mode="3d">3D</button>
      </span>
      <span class="modes tools" hidden>
        <button class="tool on" data-tool="move" title="move (W)">W</button>
        <button class="tool" data-tool="rotate" title="rotate (E)">E</button>
      </span>
      <label class="toggle gizmo-toggle" hidden><input type="checkbox" class="gizmo" checked> gizmo</label>
      <label class="toggle gizmo-size" hidden title="gizmo size">
        <input type="range" class="gsize" min="0.4" max="2.5" step="0.1" value="1">
      </label>
      <button class="recentre" hidden>Recentre</button>
      <label class="toggle mirror-toggle" hidden title="FF4 places the field's chips with z negated relative to FF3's layout; untick to see FF3's placement under the same exits"><input type="checkbox" class="mirror"> mirror z</label>
      <span class="grow"></span>
      <button class="play icon-button" hidden title="play here: export the mod and start OpenFF on this map, at the selection or where the camera looks">
        <svg viewBox="0 0 16 16" class="icon"><path d="M4 2.6v10.8L13 8z"/></svg>
      </button>
      <button class="add icon-button" title="add a game object">
        <svg viewBox="0 0 16 16" class="icon"><circle cx="6.4" cy="5" r="2.4"/><path d="M1.6 13.6a4.8 4.8 0 0 1 9.6 0"/><path d="M12.4 3.4v4.4M10.2 5.6h4.4"/></svg>
      </button>
      <button class="save primary icon-button" title="save placement">
        <svg viewBox="0 0 16 16" class="icon"><path d="M2.4 2.4h8.4l2.8 2.8v8.4H2.4z"/><path d="M5.2 2.4v4h5.2v-4M5.2 13.6V9.2h5.6v4.4"/></svg>
      </button>
      <button class="revert icon-button" title="revert the whole map to the shipped files">
        <svg viewBox="0 0 16 16" class="icon"><path d="M2.6 8a5.4 5.4 0 1 0 1.7-3.9"/><path d="M2.2 3.2v3.4h3.4"/></svg>
      </button>
    </div>
    <div class="map-body">
      <div class="map-wrap"><div class="map-scale"><div class="map"></div></div></div>
      <div class="scene-wrap" hidden>
        <canvas class="scene"></canvas>
        <div class="scene-tags"></div>
      </div>
    </div>
    <div class="timeline-dock" hidden></div>
    <div class="legend"></div>
  </div>
</template>

<!-- Images -->
<template id="view-image">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <span class="facts"></span>
      <label class="toggle"><input type="checkbox" class="checker" checked> checkerboard</label>
      <span class="grow"></span>
      <button class="replace">Replace…</button>
      <button class="revert">Revert</button>
      <input type="file" class="picker" accept="image/png" hidden>
    </div>
    <div class="image-wrap"><img class="picture" alt=""></div>
  </div>
</template>

<!-- A face of the mod's own: sample text at the sizes the game draws -->
<template id="view-font">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="badge override">override</span>
      <span class="facts"></span>
      <span class="grow"></span>
      <button class="revert">Remove</button>
    </div>
    <div class="font-wrap">
      <p class="font-note"></p>
      <div class="font-samples"></div>
    </div>
  </div>
</template>

<!-- Textures -->
<template id="view-texture">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="facts"></span>
      <label class="toggle"><input type="checkbox" class="checker" checked> checkerboard</label>
      <span class="grow"></span>
    </div>
    <div class="texture-body">
      <div class="gallery"></div>
    </div>
  </div>
</template>

<!-- Models -->
<template id="view-model">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="facts"></span>
      <label class="toggle"><input type="checkbox" class="hidden-parts"> hidden parts</label>
      <span class="grow"></span>
      <button class="export-glb" title="the model - with the motion playing - as .glb for Blender, with its skeleton (into the project's exports folder, or Save As when no project is open)">Export .glb</button>
      <button class="export-glb-all" title="the model with every motion of the pack chosen, as animations of one .glb" hidden>+ all motions</button>
      <button class="remake" title="a glTF of the project's written over this model of the game's: its skeleton and motions kept, the mesh and textures the file's (weight your mesh to the bones the export gives)" hidden>Remake from glTF…</button>
      <button class="remake-revert" title="drop the project's remake: the game's own model again" hidden>Undo remake</button>
      <button class="recentre">Recentre</button>
    </div>
    <div class="model-body">
      <div class="stage">
        <canvas class="scene"></canvas>
        <!-- The toolbox floats at the view's left (look, view toggles, brushes, cuts, markers, clips; app.js
             builds it), the active tool's properties go into the inspector, and the readout of the vertex
             under the cursor sits at the bottom right, over the view, so nothing below it reflows. -->
        <div class="stage-tools" hidden></div>
        <div class="stage-readout" hidden></div>
        <div class="stage-brush-hud" hidden></div>
      </div>
      <!-- Weight painting on a skinned glTF: the bone as a heat map, a brush, undo, save (model-viewer.js, app.js).
           The bars below are the tools' homes; the toolbox drives their checkboxes and their controls are
           shown in the inspector's tool card. -->
      <div class="paint-bar" hidden>
        <label class="toggle"><input type="checkbox" class="paint-on"> weights</label>
        <label class="toggle" title="the skeleton over the model: crosses at the joints, lines to the parents; the picked bone in yellow"><input type="checkbox" class="paint-bones"> bones</label>
        <label class="toggle" title="the mesh's edges over the model"><input type="checkbox" class="paint-wire"> wireframe</label>
        <span class="paint-controls" hidden>
          <label class="toggle" title="colour the model by the picked bone's weight: blue none, green half, red all (off: the shaded model, still painted)"><input type="checkbox" class="paint-heat" checked> heat map</label>
          <select class="paint-bone" title="the bone shown as a heat map (blue none, green half, red all) and painted; Alt+click the mesh to pick the bone under the cursor"></select>
          <label class="toggle" title="every bone at once, each in its own colour (the hierarchy shows which); off: the picked bone alone, blue to red"><input type="checkbox" class="paint-heat-all"> all bones</label>
          <select class="paint-mode" title="assign makes the ring the picked bone's outright (the tool for 'this part belongs to that bone'); add blends the bone's weight in; erase takes it off, the weight going to the bones around; smooth blends with the neighbours">
            <option value="assign">assign</option>
            <option value="add">add</option>
            <option value="erase">erase</option>
            <option value="smooth">smooth</option>
          </select>
          <label>radius <input type="range" class="paint-radius" min="0.1" max="4" step="0.1" value="0.8"><span class="paint-radius-value">0.8</span></label>
          <label>strength <input type="range" class="paint-strength" min="0.02" max="1" step="0.02" value="0.3"><span class="paint-strength-value">0.30</span></label>
          <label class="toggle" title="paint the x-mirrored spot too, with the L_/R_ counterpart bone (off by default: few models are symmetric to the vertex, and the mirrored stroke lands where the other side's mesh is not)"><input type="checkbox" class="paint-mirror"> mirror</label>
          <button class="paint-undo" title="Ctrl+Z">Undo</button>
          <button class="paint-clear" title="take the picked bone off every vertex, nothing else changed (one undo step)">Clear bone</button>
          <button class="paint-smooth-all" title="one smoothing pass over the whole mesh (one undo step)">Smooth all</button>
          <button class="paint-discard" title="throw away every unsaved stroke: the weights as the file has them">Discard</button>
          <button class="paint-rerig" title="run the auto-rig again from the original, unrigged file and start over (the saved weights are replaced)" hidden>Redo auto-rig</button>
          <button class="paint-cuts" title="open the original, unrigged file, where the auto-rig's cuts and markers are set" hidden>Cuts &amp; markers…</button>
          <button class="paint-save" title="write the weights into the .glb and remake the game model from it">Save weights</button>
          <span class="paint-readout" title="the bones of the vertex under the cursor"></span>
          <span class="paint-hint">left drag paints · Ctrl held erases, Shift held smooths · right drag sets the brush (sideways radius, up strength; [ ] and { } too) · Alt+drag orbits, Alt+click picks the bone · middle drag pans · 1-4 the brushes, B bones, W wireframe, H heat, C colours, Up/Down the bone, Ctrl+Z undo, Ctrl+S save · the ring is the brush: it paints the surface it sits on, out to the ring along the mesh, not what lies behind; the inner ring is the strength · assign gives the ring to the bone outright · erase takes only that bone's weight off, nothing moves elsewhere; a vertex with no bone left stays as the file has it</span>
        </span>
      </div>
      <!-- A glTF with animation clips of its own, standing in for a game model: which clip plays for which of the game's motions (defs/models "clips"; app.js). -->
      <div class="clips-bar" hidden>
        <label class="toggle"><input type="checkbox" class="clips-on"> own clips</label>
        <span class="clips-controls" hidden>
          <span class="clips-note"></span>
          <span class="clips-rows"></span>
          <span class="clips-custom"><input type="text" class="clips-key" placeholder="motion id or name (1004, b01_002_01)" size="26"><button class="clips-add" title="a row for one motion of the game's, by its id or its pack name (the transport lists them)">Add motion</button></span>
          <button class="clips-save" title="write the map into defs/models/&lt;model&gt;.json - the client plays these clips in the motions' place">Save clips</button>
        </span>
      </div>
      <!-- An unrigged glTF of the project's: where the auto-rig cuts it into head, arms, legs and skirt, drawn on the model and adjustable (app.js). -->
      <div class="rig-bar" hidden>
        <label class="toggle"><input type="checkbox" class="rig-on"> auto-rig cuts</label>
        <span class="rig-controls" hidden>
          <label>to <input type="text" class="rig-model" value="j101" size="5" title="the game model whose skeleton the file is bound to (j101 is Luneth's)"></label>
          <label class="rig-cut" data-cut="neck" title="the head begins here (found: the narrowest slice between the head's widest and the shoulders')"><input type="checkbox" class="rig-auto" checked> neck <input type="range" min="0" max="100" step="0.5" disabled><b>-</b></label>
          <label class="rig-cut" data-cut="hips" title="the legs and a skirt begin below here (found: the model's hip joint)"><input type="checkbox" class="rig-auto" checked> hips <input type="range" min="0" max="100" step="0.5" disabled><b>-</b></label>
          <label class="rig-cut" data-cut="armFloor" title="nothing below here is an arm (found: a little under the model's hands)"><input type="checkbox" class="rig-auto" checked> arm floor <input type="range" min="0" max="100" step="0.5" disabled><b>-</b></label>
          <label class="rig-cut" data-cut="torsoWidth" title="the torso's width as a share of the file's width, about the middle; outside it, between the arm floor and the neck, is an arm (found: from the gap between arm and torso)"><input type="checkbox" class="rig-auto" checked> torso <input type="range" min="2" max="100" step="0.5" disabled><b>-</b></label>
          <label class="toggle" title="below the hips, what hangs as one piece across the middle - a skirt, a tunic - follows the hips, not the legs; and nothing above the hips follows a leg"><input type="checkbox" class="rig-skirt" checked> skirt</label>
          <label class="toggle" title="off: no regions - every vertex takes weights from the whole of the original, as the first auto-rig did"><input type="checkbox" class="rig-enabled" checked> regions</label>
          <label class="toggle" title="the game's skeleton with its joints moved to where this file has them (the markers, else the mesh's own rings), weights by distance to those bones, the game's motions retargeted onto it - limbs of the file's own lengths bend where the file bends. OpenFF only; off: the file bound to the game's joints as they are"><input type="checkbox" class="rig-fitted"> fitted skeleton</label>
          <button class="rig-find" title="find the blanks from the file's shape and count each region's vertices - writes nothing">Find</button>
          <button class="rig-go" title="bind the file to the model's skeleton with these cuts, as assets/&lt;name&gt;-rigged.glb, and remake the game model from it">Auto-rig</button>
          <span class="rig-readout"></span>
          <!-- Markers placed on the model, an auto-rigger's way: they set the cuts and give the arms their direction. -->
          <span class="rig-markers">
            <label class="toggle" title="place markers on the model by clicking it: the one lit below goes where you click, then the next; a placed one is clicked again to move it"><input type="checkbox" class="rig-place"> place markers</label>
            <label class="toggle" title="a wrist, elbow or knee placed on one side is placed on the other too, mirrored"><input type="checkbox" class="rig-symmetry" checked> symmetry</label>
            <span class="rig-marker-list"></span>
            <button class="rig-markers-clear" title="take every marker off">Clear markers</button>
          </span>
        </span>
      </div>
      <!-- A weapon in a character's hand: the character, the hand, and the item's fit (hand-preview.js). -->
      <div class="hand-bar" hidden>
        <label class="toggle"><input type="checkbox" class="hand-on"> on a character</label>
        <span class="hand-controls" hidden>
          <select class="hand-body" title="the character model"></select>
          <select class="hand-which" title="which hand - a weapon sits in the hand (R_te / L_te), a shield on the forearm (R_ude / L_ude)">
            <option value="right">right hand (weapon)</option>
            <option value="left">left hand (weapon)</option>
            <option value="rightShield">right forearm (shield)</option>
            <option value="leftShield">left forearm (shield)</option>
          </select>
          <span class="hand-fit" hidden>
            <span class="hand-fit-label" title="The item definition's fit: modelScale, modelRotation (degrees about X, Y, Z) and modelOffset - saved to the definition as you change them">fit</span>
            <label>scale <input type="number" class="hand-scale" step="0.05" min="0.05"></label>
            <label>rot <input type="number" class="hand-rx" step="5" title="degrees about X"><input type="number" class="hand-ry" step="5" title="degrees about Y"><input type="number" class="hand-rz" step="5" title="degrees about Z"></label>
            <label>offset <input type="number" class="hand-ox" step="0.1" title="X"><input type="number" class="hand-oy" step="0.1" title="Y"><input type="number" class="hand-oz" step="0.1" title="Z"></label>
            <button class="hand-reset" title="back to no turn, no offset, scale 1">reset</button>
          </span>
          <span class="hand-note none"></span>
        </span>
      </div>
      <!-- Motion: which pack, which motion in it, and where in it we are. -->
      <div class="anim-bar" hidden>
        <select class="anim-pack" title="motion pack (.ncap)"></select>
        <select class="anim-motion" title="motion"></select>
        <button class="anim-play" title="play / pause (space)">&#9654;</button>
        <label class="toggle"><input type="checkbox" class="anim-loop" checked> loop</label>
        <select class="anim-speed" title="speed">
          <option value="0.25">&frac14;&times;</option>
          <option value="0.5">&frac12;&times;</option>
          <option value="1" selected>1&times;</option>
          <option value="2">2&times;</option>
        </select>
        <span class="anim-frame">0 / 0</span>
        <canvas class="anim-timeline" height="28"></canvas>
      </div>
    </div>
  </div>
</template>

<!-- Cells -->
<template id="view-cell">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="facts"></span>
      <label class="toggle"><input type="checkbox" class="squash" checked> as the game draws it</label>
      <label class="toggle"><input type="checkbox" class="outlines"> outlines</label>
      <span class="grow"></span>
    </div>
    <div class="cell-body">
      <div class="cell-list"></div>
    </div>
  </div>
</template>

<!-- Audio -->
<template id="view-audio">
  <div class="view">
    <div class="bar">
      <strong class="name"></strong>
      <span class="grow"></span>
    </div>
    <div class="audio-body">
      <dl class="facts"></dl>
      <h3>Listen</h3>
      <div class="players"></div>
      <h3>Play it from a script</h3>
      <pre class="call"></pre>
      <h3>What plays it</h3>
      <ul class="uses"><li class="empty">looking…</li></ul>
    </div>
  </div>
</template>
